[tool.poetry]
name = "kira-shared"
version = "0.1.0"
description = "KIRA shared library — schemas, middleware, and utilities"
authors = ["KIRA Team"]

[tool.poetry.dependencies]
python = "^3.13"
pydantic = "^2.9"
pydantic-settings = "^2.5"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
python-jose = {extras = ["cryptography"], version = "^3.5"}
pwdlib = {extras = ["bcrypt"], version = "^0.3"}
cryptography = "^44.0"
structlog = "^24.0"
aiokafka = "^0.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
