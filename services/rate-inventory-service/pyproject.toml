[tool.poetry]
name = "kira-rate-inventory-service"
version = "0.1.0"
description = "KIRA Rate & Inventory Service"
authors = ["KIRA Team"]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = {extras = ["standard"], version = "^0.115"}
uvicorn = {extras = ["standard"], version = "^0.34"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
alembic = "^1.14"
pydantic = "^2.9"
pydantic-settings = "^2.5"
python-jose = {extras = ["cryptography"], version = "^3.5"}
pwdlib = {extras = ["bcrypt"], version = "^0.3"}
redis = "^5.0"
celery = {extras = ["redis"], version = "^5.4"}
httpx = "^0.28"
structlog = "^24.0"
prometheus-fastapi-instrumentator = "^7.0"
aiokafka = "^0.13"
sendgrid = "^6.11"
pyotp = "^2.9"
cryptography = "^44.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.0"
ruff = "^0.11"
factory-boy = "^3.3"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
