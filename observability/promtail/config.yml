server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=kira"]

    relabel_configs:
      # Use the container name (strips the leading /)
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

      # Use the Docker Compose service name as the "service" label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # Tag every log line with the Compose project name
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project

      # Drop exporters and promtail itself — their logs are not useful in Loki
      - source_labels: [service]
        regex: "postgres-exporter|redis-exporter|promtail"
        action: drop

    pipeline_stages:
      # Attempt to parse the log line as JSON (structlog output)
      - json:
          expressions:
            level: level
            event: event
            timestamp: timestamp

      # Promote level to a Loki label for efficient filtering
      - labels:
          level:

      # Normalise "warn" → "warning" for consistency
      - replace:
          expression: "(warn)"
          replace: "warning"
          source: level

      # Parse the structured timestamp if present; fall back to ingestion time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.999999999Z07:00"
          action_on_failure: skip

      # Drop DEBUG logs to keep Loki volume manageable in local dev.
      # Comment out this stage if you want debug logs visible in Grafana.
      - drop:
          source: level
          expression: "debug"
