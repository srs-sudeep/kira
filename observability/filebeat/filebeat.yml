# Filebeat config for optional ELK stack.
# Only used when elasticsearch + kibana are uncommented in docker-compose.observability.yml.

filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      templates:
        - condition:
            contains:
              docker.container.labels.com.docker.compose.project: "kira"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true
                - add_docker_metadata: ~
                - add_fields:
                    target: ""
                    fields:
                      project: kira

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "kira-logs-%{+yyyy.MM.dd}"

setup.kibana:
  host: "http://kibana:5601"

setup.dashboards.enabled: true

setup.ilm.enabled: true
setup.ilm.rollover_alias: "kira-logs"
setup.ilm.pattern: "{now/d}-000001"
setup.ilm.policy_name: "kira-logs-policy"

# Index template
setup.template.name: "kira-logs"
setup.template.pattern: "kira-logs-*"

logging.level: warning
