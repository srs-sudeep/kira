apiVersion: 1

providers:
  - name: "KIRA Dashboards"
    orgId: 1
    folder: "KIRA"
    folderUid: "kira"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
