global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: kira
    env: local

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # Uncomment and set address to enable Alertmanager:
          # targets: ["alertmanager:9093"]

scrape_configs:
  # ── Prometheus self-monitoring ──────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── KIRA application services ───────────────────────────────────────────────
  - job_name: identity-service
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-service:8001"]
        labels:
          service: identity-service

  - job_name: rate-inventory-service
    metrics_path: /metrics
    static_configs:
      - targets: ["rate-inventory-service:8002"]
        labels:
          service: rate-inventory-service

  - job_name: reservation-service
    metrics_path: /metrics
    static_configs:
      - targets: ["reservation-service:8003"]
        labels:
          service: reservation-service

  - job_name: channel-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["channel-engine:8004"]
        labels:
          service: channel-engine

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8005"]
        labels:
          service: notification-service

  - job_name: admin-service
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-service:8006"]
        labels:
          service: admin-service

  # ── Kong API Gateway ────────────────────────────────────────────────────────
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8100"]
        labels:
          service: kong-gateway

  # ── Database exporters ──────────────────────────────────────────────────────
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
