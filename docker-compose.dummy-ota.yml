# Optional dummy OTA HTTP server for local dev (seeded hotels, reservations, inventory).
#
# Prerequisites: main stack created the Docker network (default project name `kira`):
#   docker compose -f docker-compose.yml up -d postgres redis
#   # …or full stack; network will be named `kira_kira-net`
#
# Start dummy OTA (reachable as http://dummy-ota:18080 from other containers on kira-net):
#   docker compose -f docker-compose.yml -f docker-compose.dummy-ota.yml up -d dummy-ota
#
# From your host (loopback only):
#   curl -s http://127.0.0.1:18080/health
#   open http://127.0.0.1:18080/docs
#
# If `network kira_kira-net declared as external, but could not be found`, bring up the
# main compose file first, or set COMPOSE_PROJECT_NAME to match your running project.

services:
  dummy-ota:
    build:
      context: ./dev/dummy-ota-server
      dockerfile: Dockerfile
    container_name: kira-dummy-ota
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:18080"
    networks:
      - kira-net

networks:
  kira-net:
    external: true
    name: kira_kira-net
