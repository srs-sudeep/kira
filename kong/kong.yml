_format_version: "3.0"
_transform: true

services:
  # ---------------------------------------------------------------------------
  - name: gateway-landing
    url: http://127.0.0.1:1
    routes:
      - name: kong-root
        paths:
          # Prefix `/`; Kong prefers the longest matching path, so `/api/v1/…` still hits APIs.
          - "/"
        methods:
          - GET
          - HEAD
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: "text/html; charset=utf-8"
          body: |
            <!DOCTYPE html>
            <html lang="en"><head><meta charset="utf-8"/><title>KIRA API Gateway</title></head><body>
            <h1>KIRA Kong (port 8000)</h1>
            <p>HTTP APIs are under <strong>/api/v1/</strong>. OpenAPI (Swagger) is <strong>not</strong> exposed through Kong — open each service directly, e.g. <a href="http://localhost:8001/docs">identity-service /docs</a> on port 8001.</p>
            <p><a href="http://localhost:3000">Web app :3000</a> · <a href="http://localhost:4000">Docs site :4000</a> (run <code>make docs-dev</code>) · <a href="http://localhost:8025">Mailhog</a></p>
            </body></html>

  # ---------------------------------------------------------------------------
  # Identity Service — auth, users, audit, permissions
  # ---------------------------------------------------------------------------
  - name: identity-service
    url: http://identity-service:8001
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: false
      - name: users-route
        paths:
          - /api/v1/users
        strip_path: false
      - name: audit-route
        paths:
          - /api/v1/audit
        strip_path: false
      - name: permissions-route
        paths:
          - /api/v1/permissions
        strip_path: false
    plugins:
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid#counter
          echo_downstream: true

  # ---------------------------------------------------------------------------
  # Rate & Inventory Service — rooms, inventory
  # ---------------------------------------------------------------------------
  - name: rate-inventory-service
    url: http://rate-inventory-service:8002
    routes:
      - name: rooms-route
        paths:
          - /api/v1/rooms
        strip_path: false
      - name: inventory-route
        paths:
          - /api/v1/inventory
        strip_path: false
    plugins:
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid#counter
          echo_downstream: true

  # ---------------------------------------------------------------------------
  # Reservation Service
  # ---------------------------------------------------------------------------
  - name: reservation-service
    url: http://reservation-service:8003
    routes:
      - name: dashboard-route
        paths:
          - /api/v1/dashboard
        strip_path: false
      - name: reservations-route
        paths:
          - /api/v1/reservations
        strip_path: false
    plugins:
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid#counter
          echo_downstream: true

  # ---------------------------------------------------------------------------
  # Channel Engine
  # ---------------------------------------------------------------------------
  - name: channel-engine
    url: http://channel-engine:8004
    routes:
      - name: channels-route
        paths:
          - /api/v1/channels
        strip_path: false
    plugins:
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid#counter
          echo_downstream: true

  # ---------------------------------------------------------------------------
  # Notification Service
  # ---------------------------------------------------------------------------
  - name: notification-service
    url: http://notification-service:8005
    routes:
      - name: notifications-route
        paths:
          - /api/v1/notifications
        strip_path: false
    plugins:
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid#counter
          echo_downstream: true

  # ---------------------------------------------------------------------------
  # Admin Service
  # ---------------------------------------------------------------------------
  - name: admin-service
    url: http://admin-service:8006
    routes:
      - name: tenants-route
        paths:
          - /api/v1/tenants
        strip_path: false
    plugins:
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid#counter
          echo_downstream: true
