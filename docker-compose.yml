name: kira

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - kira-net

x-app-defaults: &app-defaults
  <<: *service-defaults
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    <<: *service-defaults
    image: postgres:16
    environment:
      POSTGRES_DB: kira
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kira"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    <<: *service-defaults
    image: confluentinc/cp-kafka:7.6.0
    # Bind to loopback only — avoids random internet probes on :9092, which cause
    # InvalidReceiveException (non-Kafka clients send HTTP/noise). CI and host tools still use localhost:9092.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mailhog:
    <<: *service-defaults
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  identity-service:
    <<: *app-defaults
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    env_file: ./services/identity-service/.env.local
    ports:
      - "8001:8001"
    volumes:
      # Full tree so Alembic (migrations/, alembic.ini) is available inside the container
      - ./services/identity-service:/app
      - ./shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  rate-inventory-service:
    <<: *app-defaults
    build:
      context: ./services/rate-inventory-service
      dockerfile: Dockerfile
    env_file: ./services/rate-inventory-service/.env.local
    ports:
      - "8002:8002"
    volumes:
      - ./services/rate-inventory-service:/app
      - ./shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  reservation-service:
    <<: *app-defaults
    build:
      context: ./services/reservation-service
      dockerfile: Dockerfile
    env_file: ./services/reservation-service/.env.local
    ports:
      - "8003:8003"
    volumes:
      - ./services/reservation-service:/app
      - ./shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  channel-engine:
    <<: *app-defaults
    build:
      context: ./services/channel-engine
      dockerfile: Dockerfile
    env_file: ./services/channel-engine/.env.local
    ports:
      - "8004:8004"
    volumes:
      - ./services/channel-engine:/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload

  notification-service:
    <<: *app-defaults
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    env_file: ./services/notification-service/.env.local
    ports:
      - "8005:8005"
    volumes:
      - ./services/notification-service:/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload

  admin-service:
    <<: *app-defaults
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    env_file: ./services/admin-service/.env.local
    ports:
      - "8006:8006"
    volumes:
      - ./services/admin-service:/app
      - ./shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8006 --reload

  # ---------------------------------------------------------------------------
  # Celery workers
  # ---------------------------------------------------------------------------
  channel-worker:
    <<: *service-defaults
    build:
      context: ./services/channel-engine
      dockerfile: Dockerfile
    env_file: ./services/channel-engine/.env.local
    volumes:
      - ./services/channel-engine:/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: celery -A app.tasks worker --loglevel=info --queues=channel

  notification-worker:
    <<: *service-defaults
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    env_file: ./services/notification-service/.env.local
    volumes:
      - ./services/notification-service:/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: celery -A app.tasks worker --loglevel=info --queues=notifications

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  kong:
    <<: *service-defaults
    image: kong:3.6
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    ports:
      - "8000:8000"
      - "8100:8001"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # One-off DB seed (run: docker compose --profile tools run --rm seed-data)
  # ---------------------------------------------------------------------------
  seed-data:
    image: python:3.13-slim
    profiles: [tools]
    volumes:
      - ./:/work
    working_dir: /work
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/kira
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kira-net
    command:
      [
        "sh",
        "-c",
        "pip install --no-cache-dir -q asyncpg && python scripts/seed_data.py",
      ]

  # ---------------------------------------------------------------------------
  # Frontend — Vite dev server (http://localhost:3000)
  # API calls go to Kong :8000 via Vite proxy (/api → localhost:8000 from browser host)
  # ---------------------------------------------------------------------------
  web-app:
    <<: *service-defaults
    image: node:20-alpine
    working_dir: /app
    environment:
      # Vite dev server proxies /api → Kong; must use service DNS from inside the container
      API_PROXY_TARGET: http://kong:8000
    volumes:
      - ./web-app:/app
    ports:
      - "3000:3000"
    command:
      [
        "sh",
        "-c",
        "npm install && npx vite --host 0.0.0.0 --port 3000",
      ]
    depends_on:
      kong:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Documentation site (static build) — optional profile to avoid slow rebuilds on every up
  # Start with: docker compose --profile docs up -d docs-site   OR   make docs-docker-up
  # ---------------------------------------------------------------------------
  docs-site:
    <<: *service-defaults
    build:
      context: ./docs-site
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    profiles:
      - docs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  kira-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  kafkadata:
