apiVersion: v1
kind: Secret
metadata:
  name: kira-identity-service-secret
  namespace: kira-minikube
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/kira_identity"
  SECRET_KEY: "minikube-dev-secret-key-identity"
  JWT_SECRET_KEY: "minikube-dev-jwt-secret-key-identity-0123456789abcdef0123456789abcdef"
