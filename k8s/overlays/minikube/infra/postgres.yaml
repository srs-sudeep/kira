apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: kira-minikube
data:
  init-databases.sql: |
    CREATE DATABASE kira_identity;
    CREATE DATABASE kira_rate_inventory;
    CREATE DATABASE kira_reservation;
    CREATE DATABASE kira_channel;
    CREATE DATABASE kira_notification;
    CREATE DATABASE kira_admin;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kira-minikube
  labels:
    app: postgres
    app.kubernetes.io/part-of: kira
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: kira
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "kira"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kira-minikube
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
