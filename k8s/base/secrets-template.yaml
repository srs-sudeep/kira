# ── SECRETS TEMPLATE ──────────────────────────────────────────────────────────
# DO NOT apply this file directly. It documents the Kubernetes Secrets that
# must be created in each namespace (kira / kira-staging) before deploying.
#
# Create each secret with:
#   kubectl create secret generic <name> \
#     --from-literal=KEY=value \
#     --namespace=kira
#
# Or use Sealed Secrets / AWS Secrets Manager / Vault for production.
# ─────────────────────────────────────────────────────────────────────────────

# ── identity-service ─────────────────────────────────────────────────────────
# kubectl create secret generic kira-identity-service-secret \
#   --from-literal=DATABASE_URL="postgresql+asyncpg://user:pass@postgres:5432/kira_identity" \
#   --from-literal=SECRET_KEY="<random 32-char string>" \
#   --from-literal=JWT_SECRET_KEY="<random 64-char string>" \
#   --namespace=kira

