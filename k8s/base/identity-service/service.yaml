apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: kira
  labels:
    app: identity-service
    app.kubernetes.io/name: identity-service
spec:
  type: ClusterIP
  selector:
    app: identity-service
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
