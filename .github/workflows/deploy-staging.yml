name: Deploy — Staging (Manual)

# Manual full-stack staging redeploy — use this to sync all services
# to their current `latest` tag or a specific SHA without waiting for CI.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to "latest")'
        required: false
        default: latest
        type: string

jobs:
  deploy-staging:
    name: Deploy all → Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy all services
        run: |
          SERVICES="identity-service rate-inventory-service reservation-service channel-engine notification-service admin-service web-app"
          TAG="${{ inputs.image_tag }}"

          for svc in $SERVICES; do
            echo "▶ Deploying $svc:$TAG"
            kubectl set image deployment/$svc \
              $svc=${{ secrets.ECR_REGISTRY }}/kira-$svc:$TAG \
              -n kira-staging
          done

          echo "Waiting for rollouts..."
          for svc in $SERVICES; do
            kubectl rollout status deployment/$svc -n kira-staging --timeout=180s
            echo "✓ $svc"
          done

      - name: Deploy Celery worker
        run: |
          kubectl set image deployment/channel-engine-worker \
            channel-engine-worker=${{ secrets.ECR_REGISTRY }}/kira-channel-engine:${{ inputs.image_tag }} \
            -n kira-staging
          kubectl rollout status deployment/channel-engine-worker -n kira-staging --timeout=180s
